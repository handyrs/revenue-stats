<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目营收统计</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 { font-size: 24px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .edit-link {
      font-size: 13px;
      color: #3b82f6;
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .edit-link:hover { background: #3b82f6; color: white; }

    .overview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1a2332;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2d3748;
    }
    .stat-card .label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card .value.green { color: #10b981; }
    .stat-card .value.red { color: #ef4444; }
    .stat-card .value.blue { color: #3b82f6; }

    .main-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .projects-panel { }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .project-list { display: flex; flex-direction: column; gap: 8px; }
    .project-item {
      background: #1a2332;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .project-item:hover { border-color: #3b82f6; }
    .project-item.active { border-color: #3b82f6; background: #1e2a3d; }
    .project-item .name { font-weight: 600; margin-bottom: 6px; }
    .project-item .stats { display: flex; justify-content: space-between; font-size: 13px; }
    .project-item .profit { font-weight: 600; }
    .project-item .profit.positive { color: #10b981; }
    .project-item .profit.negative { color: #ef4444; }
    .project-item .profit.zero { color: #9ca3af; }

    .chart-panel { background: #1a2332; border-radius: 12px; padding: 20px; border: 1px solid #2d3748; }
    .chart-container { position: relative; height: 260px; display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100%; max-height: 100%; }
    .chart-empty { color: #9ca3af; font-size: 14px; }

    .table-panel {
      background: #1a2332;
      border-radius: 12px;
      border: 1px solid #2d3748;
      overflow: hidden;
    }
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #2d3748;
    }
    .table-header h3 { font-size: 16px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #151c28;
    }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #1e2a3d; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1e2a3d; }
    .type-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .type-badge.cost { background: rgba(239,68,68,0.15); color: #ef4444; }
    .type-badge.revenue { background: rgba(16,185,129,0.15); color: #10b981; }
    .amount { font-weight: 600; font-variant-numeric: tabular-nums; }
    .amount.cost { color: #ef4444; }
    .amount.revenue { color: #10b981; }
    .empty-table { text-align: center; padding: 48px; color: #6b7280; }
    .loading { text-align: center; padding: 48px; color: #9ca3af; }

    .tip-box {
      background: #1a2332;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tip-box .icon { font-size: 20px; }
    .tip-box .text { font-size: 14px; color: #9ca3af; }
    .tip-box a { color: #3b82f6; text-decoration: none; }
    .tip-box a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .overview { grid-template-columns: repeat(2, 1fr); }
      .main-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:28px;">📊</span>
        <h1>项目营收统计</h1>
      </div>
      <div class="header-right">
        <a href="https://github.com/handyrs/revenue-stats/edit/main/data.json" target="_blank" class="edit-link">
          ✏️ 编辑数据
        </a>
      </div>
    </header>

    <div class="tip-box">
      <span class="icon">💡</span>
      <span class="text">
        数据存储在 GitHub 的 <a href="https://github.com/handyrs/revenue-stats/blob/main/data.json" target="_blank">data.json</a> 文件中。
        点击上方「编辑数据」按钮跳转到 GitHub 直接编辑 JSON 文件保存即可。
      </span>
    </div>

    <div class="overview">
      <div class="stat-card">
        <div class="label">项目数</div>
        <div class="value blue" id="totalProjects">-</div>
      </div>
      <div class="stat-card">
        <div class="label">总成本</div>
        <div class="value red" id="totalCost">-</div>
      </div>
      <div class="stat-card">
        <div class="label">总收入</div>
        <div class="value green" id="totalRevenue">-</div>
      </div>
      <div class="stat-card">
        <div class="label">净利润</div>
        <div class="value" id="totalProfit">-</div>
      </div>
    </div>

    <div class="main-grid">
      <div class="projects-panel">
        <div class="panel-title">项目</div>
        <div class="project-list" id="projectList">
          <div class="loading">加载中...</div>
        </div>
      </div>

      <div class="chart-panel">
        <div class="panel-title">项目对比</div>
        <div class="chart-container">
          <canvas id="chart" width="500" height="240"></canvas>
        </div>
      </div>
    </div>

    <div class="table-panel">
      <div class="table-header">
        <h3>账目录入明细</h3>
        <span id="lastUpdate" style="font-size:12px;color:#6b7280;"></span>
      </div>
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>项目</th>
            <th>类型</th>
            <th>金额</th>
            <th>备注</th>
          </tr>
        </thead>
        <tbody id="tableBody"><tr><td colspan="5" class="loading">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    const DATA_URL = 'https://raw.githubusercontent.com/handyrs/revenue-stats/main/data.json?t=' + Date.now();

    let data = { projects: [], entries: [] };
    let selectedProjectId = null;

    function formatMoney(n) {
      return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function getProjectStats(projectId) {
      const entries = data.entries.filter(e => e.project_id === projectId);
      const cost = entries.filter(e => e.type === 'cost').reduce((s, e) => s + e.amount, 0);
      const revenue = entries.filter(e => e.type === 'revenue').reduce((s, e) => s + e.amount, 0);
      return { cost, revenue, profit: revenue - cost };
    }

    function renderOverview() {
      const totalCost = data.entries.filter(e => e.type === 'cost').reduce((s, e) => s + e.amount, 0);
      const totalRevenue = data.entries.filter(e => e.type === 'revenue').reduce((s, e) => s + e.amount, 0);
      const profit = totalRevenue - totalCost;

      document.getElementById('totalProjects').textContent = data.projects.length;
      document.getElementById('totalCost').textContent = formatMoney(totalCost);
      document.getElementById('totalRevenue').textContent = formatMoney(totalRevenue);

      const profitEl = document.getElementById('totalProfit');
      profitEl.textContent = formatMoney(profit);
      profitEl.className = 'value ' + (profit >= 0 ? 'green' : 'red');
    }

    function renderProjects() {
      const container = document.getElementById('projectList');
      if (data.projects.length === 0) {
        container.innerHTML = '<div style="color:#6b7280;font-size:14px;padding:12px;">暂无项目，请先在 data.json 中添加</div>';
        return;
      }

      container.innerHTML = data.projects.map(p => {
        const stats = getProjectStats(p.id);
        const profitClass = stats.profit > 0 ? 'positive' : stats.profit < 0 ? 'negative' : 'zero';
        const active = selectedProjectId === p.id ? ' active' : '';
        return '<div class="project-item' + active + '" onclick="selectProject(\'' + p.id + '\')"><div class="name">' + escapeHtml(p.name) + '</div><div class="stats"><span style="color:#9ca3af">盈利 ' + formatMoney(stats.profit) + '</span><span class="profit ' + profitClass + '">' + (stats.profit >= 0 ? '+' : '') + formatMoney(stats.profit) + '</span></div></div>';
      }).join('');
    }

    function selectProject(id) {
      selectedProjectId = selectedProjectId === id ? null : id;
      renderProjects();
      renderTable();
    }

    function renderChart() {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const projects = data.projects;
      if (projects.length === 0) {
        ctx.fillStyle = '#6b7280';
        ctx.font = '14px Inter';
        ctx.textAlign = 'center';
        ctx.fillText('添加项目后即可查看对比图表', W / 2, H / 2);
        return;
      }

      const padding = { top: 20, right: 30, bottom: 60, left: 60 };
      const chartW = W - padding.left - padding.right;
      const chartH = H - padding.top - padding.bottom;

      let minVal = 0, maxVal = 0;
      projects.forEach(function(p) {
        const stats = getProjectStats(p.id);
        minVal = Math.min(minVal, stats.cost, -stats.profit);
        maxVal = Math.max(maxVal, stats.revenue, stats.cost, stats.profit);
      });

      if (maxVal === 0) maxVal = 100;

      const barW = chartW / projects.length * 0.6;
      const groupW = chartW / projects.length;
      const baselineY = padding.top + chartH * (maxVal / (maxVal - minVal));

      ctx.strokeStyle = '#2d3748';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padding.left, baselineY);
      ctx.lineTo(W - padding.right, baselineY);
      ctx.stroke();

      projects.forEach(function(p, i) {
        const stats = getProjectStats(p.id);
        const groupX = padding.left + groupW * i + groupW * 0.2;

        const costH = (stats.cost / (maxVal - minVal)) * chartH;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(groupX, baselineY, barW, -costH);

        const revenueH = (stats.revenue / (maxVal - minVal)) * chartH;
        ctx.fillStyle = '#10b981';
        ctx.fillRect(groupX + barW + 4, baselineY, barW, -revenueH);

        ctx.fillStyle = '#9ca3af';
        ctx.font = '11px Inter';
        ctx.textAlign = 'center';
        const label = p.name.length > 8 ? p.name.substr(0, 8) + '..' : p.name;
        ctx.fillText(label, groupX + barW + 2, H - 20);
      });

      ctx.font = '12px Inter';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(W - 120, 10, 12, 12);
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText('成本', W - 104, 20);
      ctx.fillStyle = '#10b981';
      ctx.fillRect(W - 70, 10, 12, 12);
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText('收入', W - 54, 20);
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      let entries = data.entries.slice().sort(function(a, b) { return b.created_at - a.created_at; });

      if (selectedProjectId) {
        entries = entries.filter(function(e) { return e.project_id === selectedProjectId; });
      }

      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-table">暂无账目记录</td></tr>';
        return;
      }

      tbody.innerHTML = entries.map(function(e) {
        const project = data.projects.find(function(p) { return p.id === e.project_id; });
        return '<tr><td>' + formatDate(e.created_at) + '</td><td>' + (project ? escapeHtml(project.name) : '未知') + '</td><td><span class="type-badge ' + e.type + '">' + (e.type === 'cost' ? '成本' : '收入') + '</span></td><td class="amount ' + e.type + '">' + (e.type === 'cost' ? '-' : '+') + formatMoney(e.amount) + '</td><td style="color:#9ca3af">' + escapeHtml(e.note || '—') + '</td></tr>';
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadData() {
      try {
        const resp = await fetch(DATA_URL);
        if (resp.ok) {
          data = await resp.json();
          renderOverview();
          renderProjects();
          renderChart();
          renderTable();
          document.getElementById('lastUpdate').textContent = '最后更新: ' + new Date().toLocaleString('zh-CN');
        }
      } catch (e) {
        document.getElementById('projectList').innerHTML = '<div class="empty-table">加载失败，请刷新重试</div>';
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="empty-table">加载失败</td></tr>';
      }
    }

    loadData();
  </script>
</body>
</html>
