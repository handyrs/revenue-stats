<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目营收统计</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #0f1419;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 { font-size: 24px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .btn {
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-weight: 500;
    }
    .btn-outline { color: #9ca3af; border: 1px solid #2d3748; background: transparent; }
    .btn-outline:hover { border-color: #3b82f6; color: #3b82f6; }
    .btn-green { background: #10b981; color: white; }
    .btn-green:hover { background: #059669; }

    .overview {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1a2332;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2d3748;
    }
    .stat-card .label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card .value.green { color: #10b981; }
    .stat-card .value.red { color: #ef4444; }
    .stat-card .value.blue { color: #3b82f6; }

    .main-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .projects-panel { }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .project-list { display: flex; flex-direction: column; gap: 8px; }
    .project-item {
      background: #1a2332;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .project-item:hover { border-color: #3b82f6; }
    .project-item.active { border-color: #3b82f6; background: #1e2a3d; }
    .project-item .name { font-weight: 600; margin-bottom: 4px; }
    .project-item .meta { font-size: 12px; color: #6b7280; }
    .project-item .profit {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 700;
      font-size: 14px;
    }
    .project-item .profit.positive { color: #10b981; }
    .project-item .profit.negative { color: #ef4444; }
    .project-item .profit.zero { color: #9ca3af; }

    .add-project {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .add-project input {
      flex: 1;
      background: #1a2332;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e5e7eb;
      font-size: 14px;
    }
    .add-project input:focus { outline: none; border-color: #3b82f6; }
    .add-project button {
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }
    .add-project button:hover { background: #2563eb; }

    .chart-panel { background: #1a2332; border-radius: 12px; padding: 20px; border: 1px solid #2d3748; }
    .chart-container { position: relative; height: 260px; display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100%; max-height: 100%; }
    .chart-empty { color: #9ca3af; font-size: 14px; }

    .entry-panel {
      background: #1a2332;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #2d3748;
      margin-bottom: 24px;
    }
    .entry-form {
      display: grid;
      grid-template-columns: 160px 120px 140px 1fr 100px;
      gap: 12px;
      align-items: end;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: #9ca3af; font-weight: 500; }
    .form-group select, .form-group input {
      background: #0f1419;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e5e7eb;
      font-size: 14px;
    }
    .form-group select:focus, .form-group input:focus { outline: none; border-color: #3b82f6; }
    .form-group select { cursor: pointer; }
    .btn-add {
      background: #10b981;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      height: 42px;
    }
    .btn-add:hover { background: #059669; }

    .table-panel {
      background: #1a2332;
      border-radius: 12px;
      border: 1px solid #2d3748;
      overflow: hidden;
    }
    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #2d3748;
    }
    .table-header h3 { font-size: 16px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: #151c28;
    }
    td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid #1e2a3d; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1e2a3d; }
    .type-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .type-badge.cost { background: rgba(239,68,68,0.15); color: #ef4444; }
    .type-badge.revenue { background: rgba(16,185,129,0.15); color: #10b981; }
    .amount { font-weight: 600; font-variant-numeric: tabular-nums; }
    .amount.cost { color: #ef4444; }
    .amount.revenue { color: #10b981; }
    .delete-btn {
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .delete-btn:hover { background: rgba(239,68,68,0.15); color: #ef4444; }
    .empty-table { text-align: center; padding: 48px; color: #6b7280; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: white;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; }

    /* Token 输入弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal {
      background: #1a2332;
      border: 1px solid #2d3748;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
    }
    .modal h2 { font-size: 20px; margin-bottom: 12px; }
    .modal p { font-size: 14px; color: #9ca3af; margin-bottom: 20px; line-height: 1.6; }
    .modal input {
      width: 100%;
      background: #0f1419;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 12px;
      color: #e5e7eb;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .modal input:focus { outline: none; border-color: #3b82f6; }
    .modal .btn-row { display: flex; gap: 12px; justify-content: flex-end; }
    .modal .btn-row .btn { padding: 10px 20px; }
    .modal .hint { font-size: 12px; color: #6b7280; margin-top: 12px; }
    .modal .hint a { color: #3b82f6; text-decoration: none; }

    @media (max-width: 900px) {
      .overview { grid-template-columns: repeat(2, 1fr); }
      .main-grid { grid-template-columns: 1fr; }
      .entry-form { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <!-- Token 弹窗 -->
  <div class="modal-overlay" id="tokenModal">
    <div class="modal">
      <h2>🔑 设置 GitHub Token</h2>
      <p>为了同步数据到 GitHub，需要你的 GitHub Personal Access Token。Token 只存在你浏览器本地，不会传给任何人。</p>
      <input type="password" id="tokenInput" placeholder="粘贴你的 GitHub Token...">
      <div class="btn-row">
        <button class="btn btn-outline" onclick="useLocalOnly()">本地模式</button>
        <button class="btn btn-green" onclick="saveToken()">确认</button>
      </div>
      <div class="hint">
        Token 创建：<a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a><br>
        勾选 <strong>gist</strong> 权限即可
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:28px;">📊</span>
        <h1>项目营收统计</h1>
      </div>
      <div class="header-right">
        <span id="syncStatus" style="font-size:12px;color:#6b7280;margin-right:8px;"></span>
        <button class="btn btn-outline" onclick="clearAll()">🗑️ 清空</button>
      </div>
    </header>

    <div class="overview">
      <div class="stat-card">
        <div class="label">项目数</div>
        <div class="value blue" id="totalProjects">0</div>
      </div>
      <div class="stat-card">
        <div class="label">总成本</div>
        <div class="value red" id="totalCost">¥0</div>
      </div>
      <div class="stat-card">
        <div class="label">总收入</div>
        <div class="value green" id="totalRevenue">¥0</div>
      </div>
      <div class="stat-card">
        <div class="label">净利润</div>
        <div class="value" id="totalProfit">¥0</div>
      </div>
    </div>

    <div class="main-grid">
      <div class="projects-panel">
        <div class="panel-title">项目</div>
        <div class="project-list" id="projectList">
          <div class="loading" style="text-align:center;padding:20px;color:#6b7280;">加载中...</div>
        </div>
        <div class="add-project">
          <input type="text" id="newProjectName" placeholder="新项目名称..." onkeydown="if(event.key==='Enter')addProject()">
          <button onclick="addProject()">+</button>
        </div>
      </div>

      <div class="chart-panel">
        <div class="panel-title">项目对比</div>
        <div class="chart-container">
          <canvas id="chart" width="500" height="240"></canvas>
        </div>
      </div>
    </div>

    <div class="entry-panel">
      <div class="panel-title" style="margin-bottom: 16px;">快速录入</div>
      <div class="entry-form">
        <div class="form-group">
          <label>项目</label>
          <select id="entryProject"><option value="">选择项目</option></select>
        </div>
        <div class="form-group">
          <label>类型</label>
          <select id="entryType">
            <option value="cost">成本 / 支出</option>
            <option value="revenue">收入</option>
          </select>
        </div>
        <div class="form-group">
          <label>金额 (¥)</label>
          <input type="number" id="entryAmount" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>备注</label>
          <input type="text" id="entryNote" placeholder="可选说明...">
        </div>
        <button class="btn-add" onclick="addEntry()">添加</button>
      </div>
    </div>

    <div class="table-panel">
      <div class="table-header">
        <h3>账目录入明细</h3>
      </div>
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>项目</th>
            <th>类型</th>
            <th>金额</th>
            <th>备注</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var TOKEN_KEY = 'revenue-stats-token';
    var GIST_ID_KEY = 'revenue-stats-gist-id';
    var DATA_KEY = 'revenue-stats-data';

    var data = { projects: [], entries: [] };
    var selectedProjectId = null;
    var token = null;
    var gistId = null;
    var isSyncing = false;

    function formatMoney(n) {
      return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
    }

    function showToast(msg) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }

    function setSyncStatus(msg) {
      document.getElementById('syncStatus').textContent = msg;
    }

    function getProjectStats(projectId) {
      var entries = data.entries.filter(function(e) { return e.project_id === projectId; });
      var cost = entries.filter(function(e) { return e.type === 'cost'; }).reduce(function(s, e) { return s + e.amount; }, 0);
      var revenue = entries.filter(function(e) { return e.type === 'revenue'; }).reduce(function(s, e) { return s + e.amount; }, 0);
      return { cost: cost, revenue: revenue, profit: revenue - cost };
    }

    function renderOverview() {
      var totalCost = data.entries.filter(function(e) { return e.type === 'cost'; }).reduce(function(s, e) { return s + e.amount; }, 0);
      var totalRevenue = data.entries.filter(function(e) { return e.type === 'revenue'; }).reduce(function(s, e) { return s + e.amount; }, 0);
      var profit = totalRevenue - totalCost;

      document.getElementById('totalProjects').textContent = data.projects.length;
      document.getElementById('totalCost').textContent = formatMoney(totalCost);
      document.getElementById('totalRevenue').textContent = formatMoney(totalRevenue);

      var profitEl = document.getElementById('totalProfit');
      profitEl.textContent = formatMoney(profit);
      profitEl.className = 'value ' + (profit >= 0 ? 'green' : 'red');
    }

    function renderProjects() {
      var container = document.getElementById('projectList');
      if (data.projects.length === 0) {
        container.innerHTML = '<div style="color:#6b7280;font-size:14px;padding:12px;">暂无项目，添加一个开始吧~</div>';
        return;
      }

      container.innerHTML = data.projects.map(function(p) {
        var stats = getProjectStats(p.id);
        var profitClass = stats.profit > 0 ? 'positive' : stats.profit < 0 ? 'negative' : 'zero';
        var active = selectedProjectId === p.id ? ' active' : '';
        var entryCount = data.entries.filter(function(e) { return e.project_id === p.id; }).length;
        return '<div class="project-item' + active + '" onclick="selectProject(\'' + p.id + '\')"><div class="name">' + escapeHtml(p.name) + '</div><div class="meta">' + entryCount + ' 条记录</div><div class="profit ' + profitClass + '">' + (stats.profit >= 0 ? '+' : '') + formatMoney(stats.profit) + '</div></div>';
      }).join('');
    }

    function selectProject(id) {
      selectedProjectId = selectedProjectId === id ? null : id;
      renderProjects();
      renderTable();
    }

    function renderChart() {
      var canvas = document.getElementById('chart');
      var ctx = canvas.getContext('2d');
      var W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      var projects = data.projects;
      if (projects.length === 0) {
        ctx.fillStyle = '#6b7280';
        ctx.font = '14px Inter';
        ctx.textAlign = 'center';
        ctx.fillText('添加项目后即可查看对比图表', W / 2, H / 2);
        return;
      }

      var padding = { top: 20, right: 30, bottom: 60, left: 60 };
      var chartW = W - padding.left - padding.right;
      var chartH = H - padding.top - padding.bottom;

      var minVal = 0, maxVal = 0;
      projects.forEach(function(p) {
        var stats = getProjectStats(p.id);
        minVal = Math.min(minVal, stats.cost, -stats.profit);
        maxVal = Math.max(maxVal, stats.revenue, stats.cost, stats.profit);
      });

      if (maxVal === 0) maxVal = 100;

      var barW = chartW / projects.length * 0.6;
      var groupW = chartW / projects.length;
      var baselineY = padding.top + chartH * (maxVal / (maxVal - minVal));

      ctx.strokeStyle = '#2d3748';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padding.left, baselineY);
      ctx.lineTo(W - padding.right, baselineY);
      ctx.stroke();

      projects.forEach(function(p, i) {
        var stats = getProjectStats(p.id);
        var groupX = padding.left + groupW * i + groupW * 0.2;

        var costH = (stats.cost / (maxVal - minVal)) * chartH;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(groupX, baselineY, barW, -costH);

        var revenueH = (stats.revenue / (maxVal - minVal)) * chartH;
        ctx.fillStyle = '#10b981';
        ctx.fillRect(groupX + barW + 4, baselineY, barW, -revenueH);

        ctx.fillStyle = '#9ca3af';
        ctx.font = '11px Inter';
        ctx.textAlign = 'center';
        var label = p.name.length > 8 ? p.name.substr(0, 8) + '..' : p.name;
        ctx.fillText(label, groupX + barW + 2, H - 20);
      });

      ctx.font = '12px Inter';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(W - 120, 10, 12, 12);
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText('成本', W - 104, 20);
      ctx.fillStyle = '#10b981';
      ctx.fillRect(W - 70, 10, 12, 12);
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText('收入', W - 54, 20);
    }

    function renderTable() {
      var tbody = document.getElementById('tableBody');
      var entries = data.entries.slice().sort(function(a, b) { return b.created_at - a.created_at; });

      if (selectedProjectId) {
        entries = entries.filter(function(e) { return e.project_id === selectedProjectId; });
      }

      if (entries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-table">暂无账目记录</td></tr>';
        return;
      }

      tbody.innerHTML = entries.map(function(e) {
        var project = data.projects.find(function(p) { return p.id === e.project_id; });
        return '<tr><td>' + formatDate(e.created_at) + '</td><td>' + (project ? escapeHtml(project.name) : '未知') + '</td><td><span class="type-badge ' + e.type + '">' + (e.type === 'cost' ? '成本' : '收入') + '</span></td><td class="amount ' + e.type + '">' + (e.type === 'cost' ? '-' : '+') + formatMoney(e.amount) + '</td><td style="color:#9ca3af">' + escapeHtml(e.note || '—') + '</td><td><button class="delete-btn" onclick="deleteEntry(\'' + e.id + '\')">✕</button></td></tr>';
      }).join('');
    }

    function updateProjectSelect() {
      var select = document.getElementById('entryProject');
      select.innerHTML = '<option value="">选择项目</option>' + data.projects.map(function(p) { return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>'; }).join('');
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 保存到本地
    function saveLocal() {
      localStorage.setItem(DATA_KEY, JSON.stringify(data));
    }

    // 从本地加载
    function loadLocal() {
      var stored = localStorage.getItem(DATA_KEY);
      if (stored) {
        try {
          return JSON.parse(stored);
        } catch (e) {
          return { projects: [], entries: [] };
        }
      }
      return { projects: [], entries: [] };
    }

    // 创建 Gist
    async function createGist() {
      var content = JSON.stringify(data, null, 2);
      var resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: {
          'Authorization': 'token ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          description: '项目营收统计数据',
          public: true,
          files: {
            'data.json': { content: content }
          }
        })
      });
      var result = await resp.json();
      if (result.id) {
        gistId = result.id;
        localStorage.setItem(GIST_ID_KEY, gistId);
        return result.id;
      }
      throw new Error('创建 Gist 失败');
    }

    // 更新 Gist
    async function updateGist() {
      if (!gistId) return;
      if (isSyncing) return;
      isSyncing = true;
      setSyncStatus('同步中...');

      var content = JSON.stringify(data, null, 2);
      try {
        await fetch('https://api.github.com/gists/' + gistId, {
          method: 'PATCH',
          headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            files: {
              'data.json': { content: content }
            }
          })
        });
        setSyncStatus('已同步');
      } catch (e) {
        setSyncStatus('同步失败');
      }
      isSyncing = false;
    }

    // 从 Gist 加载（公开读取，不需要 token）
    async function loadFromGist() {
      if (!gistId) return null;
      try {
        var resp = await fetch('https://api.github.com/gists/' + gistId);
        if (resp.ok) {
          var result = await resp.json();
          if (result.files && result.files['data.json']) {
            return JSON.parse(result.files['data.json'].content);
          }
        }
      } catch (e) {}
      return null;
    }

    // 整体加载流程
    async function loadData() {
      token = localStorage.getItem(TOKEN_KEY);
      gistId = localStorage.getItem(GIST_ID_KEY);

      // 先从本地加载显示
      data = loadLocal();
      renderAll();

      // 如果没有 token，弹窗要求输入
      if (!token) {
        document.getElementById('tokenModal').classList.remove('hidden');
        return;
      }

      // 有 token，尝试从 Gist 加载最新数据
      if (gistId) {
        var gistData = await loadFromGist();
        if (gistData && gistData.projects && gistData.entries) {
          // 如果 Gist 数据比本地新，用 Gist 数据
          var localData = loadLocal();
          var localUpdated = localData.entries.length > 0 ?
            Math.max.apply(null, localData.entries.map(function(e) { return e.created_at || 0; })) : 0;
          var gistUpdated = gistData.entries.length > 0 ?
            Math.max.apply(null, gistData.entries.map(function(e) { return e.created_at || 0; })) : 0;

          if (gistUpdated > localUpdated) {
            data = gistData;
            saveLocal();
            renderAll();
            showToast('已加载最新数据');
          }
        }
        setSyncStatus('已连接');
      }
    }

    function renderAll() {
      updateProjectSelect();
      renderOverview();
      renderProjects();
      renderChart();
      renderTable();
    }

    // 保存 Token
    function saveToken() {
      var input = document.getElementById('tokenInput');
      var t = input.value.trim();
      if (!t) { alert('请输入 Token'); return; }
      token = t;
      localStorage.setItem(TOKEN_KEY, token);
      document.getElementById('tokenModal').classList.add('hidden');

      // 创建 Gist 并保存
      (async function() {
        try {
          await createGist();
          setSyncStatus('已同步');
          showToast('Token 已保存，数据将同步到 GitHub');
          saveLocal();
          renderAll();
          updateGist();
        } catch (e) {
          showToast('Token 无效或权限不足');
          console.error(e);
        }
      })();
    }

    // 使用本地模式
    function useLocalOnly() {
      document.getElementById('tokenModal').classList.add('hidden');
      setSyncStatus('本地模式');
      showToast('已切换本地模式，数据不共享');
    }

    function addProject() {
      var input = document.getElementById('newProjectName');
      var name = input.value.trim();
      if (!name) { alert('请输入项目名称'); return; }
      if (data.projects.find(function(p) { return p.name === name; })) { alert('项目已存在'); return; }

      data.projects.push({ id: genId(), name: name, created_at: Date.now() });
      input.value = '';
      saveLocal();
      renderAll();
      if (token) updateGist();
      showToast('项目已添加');
    }

    function addEntry() {
      var projectId = document.getElementById('entryProject').value;
      var type = document.getElementById('entryType').value;
      var amount = parseFloat(document.getElementById('entryAmount').value);
      var note = document.getElementById('entryNote').value.trim();

      if (!projectId) { alert('请选择项目'); return; }
      if (!amount || amount <= 0) { alert('请输入有效金额'); return; }

      data.entries.push({ id: genId(), project_id: projectId, type: type, amount: amount, note: note, created_at: Date.now() });
      document.getElementById('entryAmount').value = '';
      document.getElementById('entryNote').value = '';

      saveLocal();
      renderAll();
      if (token) updateGist();
      showToast('账目已添加');
    }

    function deleteEntry(id) {
      if (!confirm('确定删除这条记录？')) return;
      data.entries = data.entries.filter(function(e) { return e.id !== id; });
      saveLocal();
      renderAll();
      if (token) updateGist();
    }

    function clearAll() {
      if (!confirm('确定清空所有数据？此操作不可恢复！')) return;
      data = { projects: [], entries: [] };
      selectedProjectId = null;
      saveLocal();
      renderAll();
      if (token) updateGist();
      showToast('已清空全部');
    }

    // 初始化
    loadData();
  </script>
</body>
</html>
